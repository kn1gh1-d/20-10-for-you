    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c0814;
        }

        .font-card-title {
            font-family: 'Great Vibes', cursive;
        }

        .font-card-body {
            font-family: 'Dancing Script', cursive;
        }

        /* Glassmorphism Panel cho thanh công cụ */
        .glass-panel {
            background: rgba(20, 15, 30, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(220, 200, 255, 0.25);
            box-shadow: 0 16px 48px 0 rgba(0, 0, 0, 0.55);
        }

        /* Khung Lời Chúc Kính Mờ (Glassmorphism Blur) */
        .glass-card {
            background: rgba(25, 18, 35, 0.52);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(230, 210, 255, 0.35);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(210, 180, 255, 0.18);
        }

        /* Glowing Text Effect */
        .glow-text-gold {
            color: #fff4d6;
            text-shadow: 0 0 10px rgba(255, 220, 120, 0.8), 0 0 22px rgba(255, 160, 80, 0.6), 0 0 35px rgba(230, 130, 255, 0.4);
        }

        .glow-text-title {
            background: linear-gradient(135deg, #ffffff 0%, #e2b6ff 50%, #ff99c8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 14px rgba(210, 150, 255, 0.75));
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            height: 5px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #d8b4fe;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(216, 180, 254, 0.9);
            transition: transform 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        canvas {
            display: block;
            touch-action: none;
        }

        .wish-transition {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .wish-hidden {
            opacity: 0;
            transform: translateY(8px) scale(0.98);
        }
    </style>
</head>

    <script>
        /* Bộ Lời Chúc Dành Cho Người Mới Yêu Nhau */
        const wishes = [

            "Lần đầu tiên cùng cậu đón ngày 20/10, tớ mong nụ cười của cậu luôn ngọt ngào như những đóa hoa linh lan chớm nở!",
            "Chỉ mới bắt đầu hành trình cùng nhau, nhưng từng khoảnh khắc bên cậu đều khiến tớ thấy bình yên. Chúc cậu ngày 20/10 thật trọn vẹn!",
            "Từng nhánh linh lan e ấp như tình yêu mới chớm. Mong rằng tình cảm của chúng mình sẽ luôn nhẹ nhàng và ngát hương như thế này!",
            "Cảm ơn cậu vì đã đồng ý nắm tay tớ. Chúc cô gái bé nhỏ của tớ ngày 20/10 xinh đẹp, hạnh phúc và luôn cảm nhận được sự quan tâm từ tớ nhé!"
        ];

        let currentWishIndex = 0;
        const wishContainer = document.getElementById('wishContainer');
        const wishText = document.getElementById('wishText');
        const nextWishBtn = document.getElementById('nextWishBtn');
        const toggleWishBtn = document.getElementById('toggleWishBtn');
        const wishBtnText = document.getElementById('wishBtnText');
        const greetingCard = document.getElementById('greetingCard');

        let isCardVisible = true;

        nextWishBtn.addEventListener('click', () => {
            wishContainer.classList.add('wish-hidden');
            setTimeout(() => {
                currentWishIndex = (currentWishIndex + 1) % wishes.length;
                wishText.textContent = `"${wishes[currentWishIndex]}"`;
                wishContainer.classList.remove('wish-hidden');
            }, 300);
        });

        toggleWishBtn.addEventListener('click', () => {
            isCardVisible = !isCardVisible;
            if (isCardVisible) {
                greetingCard.style.opacity = '1';
                greetingCard.style.transform = 'scale(1)';
                greetingCard.style.pointerEvents = 'auto';
                wishBtnText.textContent = 'Ẩn lời chúc';
            } else {
                greetingCard.style.opacity = '0';
                greetingCard.style.transform = 'scale(0.92)';
                greetingCard.style.pointerEvents = 'none';
                wishBtnText.textContent = 'Hiện lời chúc';
            }
        });

       

const musicUrl = 'https://www.dropbox.com/scl/fi/nvllwyt0haufdggzjc31d/T-ng-Ng-y-Y-u-Em.mp3?rlkey=hikssz53n7and1jrn7cgdqyme&st=uj64pwuq&raw=1'; 

const myAudio = new Audio(musicUrl);
myAudio.loop = true; 

let isPlayingMusic = false;
const musicBtn = document.getElementById('musicBtn');
const musicIcon = document.getElementById('musicIcon');
const musicText = document.getElementById('musicText');


function startAudio() {
    if (!isPlayingMusic) {
        myAudio.play().then(() => {
            isPlayingMusic = true;
            musicIcon.className = "fa-solid fa-volume-high text-purple-300 animate-pulse";
            musicText.textContent = "Dừng nhạc";
        }).catch(err => {
            console.log("Chờ người dùng tương tác để phát nhạc.");
        });
    }
}


function stopAudio() {
    myAudio.pause();
    isPlayingMusic = false;
    musicIcon.className = "fa-solid fa-music text-purple-300";
    musicText.textContent = "Bật nhạc du dương";
}


function handleFirstInteraction() {
    startAudio();
    window.removeEventListener('click', handleFirstInteraction);
    window.removeEventListener('touchstart', handleFirstInteraction);
}

window.addEventListener('click', handleFirstInteraction);
window.addEventListener('touchstart', handleFirstInteraction);


musicBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isPlayingMusic) {
        stopAudio();
    } else {
        startAudio();
    }
});

        /* --------------------------------------------------
         * Lily of the Valley Canvas Engine (60 FPS Cap)
         * -------------------------------------------------- */
        const canvas = document.getElementById('lilyCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const mouse = {
            x: width / 2,
            y: height / 2,
            targetX: width / 2,
            targetY: height / 2,
            parallaxX: 0,
            parallaxY: 0,
            touchRadius: 240
        };

        const params = {
            windSpeed: 3.0,
            sunGlow: 3.0,
            particleDensity: 275,
            time: 0
        };

        const lilySpriteCache = new Map();

        function getOrCreateLilySprite(scaleBucket) {
            const key = scaleBucket.toFixed(2);
            if (lilySpriteCache.has(key)) {
                return lilySpriteCache.get(key);
            }

            const scale = scaleBucket;
            const size = Math.ceil(36 * scale);
            const offCanvas = document.createElement('canvas');
            offCanvas.width = size;
            offCanvas.height = size;
            const oCtx = offCanvas.getContext('2d');

            const cx = size / 2;
            const cy = size / 2;
            const r = 10 * scale;

            oCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            oCtx.shadowColor = 'rgba(215, 180, 255, 0.8)';
            oCtx.shadowBlur = 8 * scale;

            oCtx.beginPath();
            oCtx.moveTo(cx, cy - r * 1.1);
            oCtx.bezierCurveTo(cx - r * 1.2, cy - r * 0.8, cx - r * 1.1, cy + r * 0.5, cx - r * 0.9, cy + r * 0.7);
            oCtx.lineTo(cx - r * 0.5, cy + r * 0.5);
            oCtx.lineTo(cx, cy + r * 0.8);
            oCtx.lineTo(cx + r * 0.5, cy + r * 0.5);
            oCtx.lineTo(cx + r * 0.9, cy + r * 0.7);
            oCtx.bezierCurveTo(cx + r * 1.1, cy + r * 0.5, cx + r * 1.2, cy - r * 0.8, cx, cy - r * 1.1);
            oCtx.fill();

            oCtx.fillStyle = '#ffea9f';
            oCtx.beginPath();
            oCtx.arc(cx, cy + r * 0.3, 2 * scale, 0, Math.PI * 2);
            oCtx.fill();

            const spriteData = { canvas: offCanvas, halfSize: size / 2 };
            lilySpriteCache.set(key, spriteData);
            return spriteData;
        }

        class LilyPlant {
            constructor(x, y, scale, depth) {
                this.x = x;
                this.y = y;
                this.scale = scale;
                this.depth = depth;

                this.stemHeight = (130 + Math.random() * 70) * scale;
                this.angle = (Math.random() - 0.5) * 0.08;
                this.angularVelocity = 0;
                this.phaseOffset = Math.random() * Math.PI * 2;

                const bucket = Math.round(scale * 16) / 16;
                this.sprite = getOrCreateLilySprite(bucket);
                this.bellCount = 5 + Math.floor(Math.random() * 4);
            }

            update(dt) {
                const windForce = Math.sin(params.time * 2.2 + this.phaseOffset + this.x * 0.004) * 0.035 * params.windSpeed;
                
                const headX = this.x + mouse.parallaxX * this.depth;
                const headY = this.y - this.stemHeight;
                const dx = mouse.x - headX;
                const dy = mouse.y - headY;
                const distSq = dx * dx + dy * dy;
                const maxDist = mouse.touchRadius * this.scale;

                let touchForce = 0;
                if (distSq < maxDist * maxDist) {
                    const dist = Math.sqrt(distSq);
                    const force = (1 - dist / maxDist);
                    touchForce = (dx > 0 ? -1 : 1) * force * 0.18;
                }

                const targetAngle = windForce + touchForce;
                const accel = (targetAngle - this.angle) * 25.0;
                this.angularVelocity += accel * dt;
                this.angularVelocity *= Math.pow(0.85, dt * 60);
                this.angle += this.angularVelocity * dt;
            }

            draw(parallaxX, parallaxY) {
                const px = this.x + parallaxX * this.depth;
                const py = this.y + parallaxY * this.depth;

                const topX = px + Math.sin(this.angle) * this.stemHeight + 25 * this.scale;
                const topY = py - Math.cos(this.angle) * this.stemHeight;

                ctx.save();
                ctx.translate(px, py);
                ctx.fillStyle = `hsl(125, 40%, ${10 + this.depth * 16}%)`;
                
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(-25 * this.scale, -this.stemHeight * 0.45, -15 * this.scale, -this.stemHeight * 0.7);
                ctx.quadraticCurveTo(0, -this.stemHeight * 0.3, 0, 0);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(30 * this.scale, -this.stemHeight * 0.4, 18 * this.scale, -this.stemHeight * 0.65);
                ctx.quadraticCurveTo(0, -this.stemHeight * 0.25, 0, 0);
                ctx.fill();
                ctx.restore();

                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.quadraticCurveTo(px + (topX - px) * 0.3, py - this.stemHeight * 0.6, topX, topY);
                ctx.strokeStyle = `hsl(120, 45%, ${15 + this.depth * 20}%)`;
                ctx.lineWidth = Math.max(1.5, 4.0 * this.scale);
                ctx.stroke();

                for (let i = 0; i < this.bellCount; i++) {
                    const t = 0.35 + (i / this.bellCount) * 0.6;
                    const bx = Math.pow(1 - t, 2) * px + 2 * (1 - t) * t * (px + (topX - px) * 0.3) + t * t * topX;
                    const by = Math.pow(1 - t, 2) * py + 2 * (1 - t) * t * (py - this.stemHeight * 0.6) + t * t * topY;

                    const side = (i % 2 === 0 ? 1 : -1);
                    const hangX = bx + side * (12 * this.scale);
                    const hangY = by + (8 * this.scale);

                    ctx.beginPath();
                    ctx.moveTo(bx, by);
                    ctx.lineTo(hangX, hangY);
                    ctx.strokeStyle = `hsl(120, 35%, ${20 + this.depth * 20}%)`;
                    ctx.lineWidth = Math.max(1, 2 * this.scale);
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(hangX, hangY);
                    const sway = Math.sin(params.time * 2 + i) * 0.15;
                    ctx.rotate(sway);
                    ctx.drawImage(this.sprite.canvas, -this.sprite.halfSize, -this.sprite.halfSize);
                    ctx.restore();
                }
            }
        }

        class RomanticParticle {
            constructor() {
                this.reset();
                this.y = Math.random() * height;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 20;
                this.size = 1.5 + Math.random() * 4.0;
                this.speedY = -(0.25 + Math.random() * 0.5);
                this.speedX = (Math.random() - 0.5) * 0.35;
                this.alpha = 0.15 + Math.random() * 0.65;
                this.isHeart = Math.random() < 0.28;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.03;
            }

            update(dt) {
                this.y += this.speedY * dt * 60;
                this.x += (this.speedX + Math.sin(params.time * 2 + this.y * 0.01) * 0.25 * params.windSpeed) * dt * 60;
                this.rotation += this.rotSpeed;

                if (this.y < height * 0.15 || this.x < -20 || this.x > width + 20) {
                    this.reset();
                }
            }

            draw(parallaxX, parallaxY) {
                const px = this.x + parallaxX * 0.7;
                const py = this.y + parallaxY * 0.7;

                ctx.save();
                ctx.translate(px, py);

                if (this.isHeart) {
                    ctx.rotate(this.rotation);
                    const hSize = this.size * 2.2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-hSize, -hSize, -hSize * 1.5, hSize * 0.5, 0, hSize * 1.5);
                    ctx.bezierCurveTo(hSize * 1.5, hSize * 0.5, hSize, -hSize, 0, 0);
                    ctx.fillStyle = `rgba(235, 160, 255, ${this.alpha * params.sunGlow * 0.85})`;
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(270, 100%, 85%, ${this.alpha * params.sunGlow})`;
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        let lilies = [];
        let particles = [];
        let skyCanvas;

        function preRenderSky() {
            skyCanvas = document.createElement('canvas');
            skyCanvas.width = width;
            skyCanvas.height = height;
            const sCtx = skyCanvas.getContext('2d');

            const grad = sCtx.createLinearGradient(0, 0, 0, height * 0.65);
            grad.addColorStop(0.0, '#1c092b');
            grad.addColorStop(0.28, '#461b54');
            grad.addColorStop(0.58, '#8e448b');
            grad.addColorStop(0.82, '#d67a96');
            grad.addColorStop(1.0, '#fabb96');

            sCtx.fillStyle = grad;
            sCtx.fillRect(0, 0, width, height);
        }

        function initScene() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            lilySpriteCache.clear();
            preRenderSky();

            particles = [];
            for (let i = 0; i < params.particleDensity; i++) {
                particles.push(new RomanticParticle());
            }

            lilies = [];
            const horizonY = height * 0.48;
            const lilyCount = Math.floor(Math.min(width, 1600) * 0.25);

            for (let i = 0; i < lilyCount; i++) {
                const depth = Math.pow(Math.random(), 2.0);
                const y = horizonY + depth * (height - horizonY + 30);
                const x = Math.random() * (width + 160) - 80;
                const scale = 0.18 + depth * 0.95;

                lilies.push(new LilyPlant(x, y, scale, depth));
            }

            lilies.sort((a, b) => a.depth - b.depth);
        }

        function drawSunAndRays(parallaxX, parallaxY) {
            const sunX = width * 0.14 + parallaxX * 0.12;
            const sunY = height * 0.2 + parallaxY * 0.12;
            const sunRadius = 65;

            const glowGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunRadius * 5.5);
            glowGrad.addColorStop(0, `rgba(255, 245, 230, ${0.95 * params.sunGlow})`);
            glowGrad.addColorStop(0.25, `rgba(235, 160, 200, ${0.6 * params.sunGlow})`);
            glowGrad.addColorStop(0.6, `rgba(140, 80, 160, ${0.22 * params.sunGlow})`);
            glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius * 5.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            const rayCount = 7;
            for (let i = 0; i < rayCount; i++) {
                const angle = 0.25 + (i / rayCount) * Math.PI * 0.75 + Math.sin(params.time * 0.5 + i) * 0.015;
                const rayWidth = 0.12 + Math.sin(i * 1.8) * 0.04;

                const rayGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.max(width, height) * 1.1);
                rayGrad.addColorStop(0, `rgba(235, 200, 255, ${0.22 * params.sunGlow})`);
                rayGrad.addColorStop(0.8, `rgba(180, 100, 220, ${0.04 * params.sunGlow})`);
                rayGrad.addColorStop(1, 'rgba(0,0,0,0)');

                ctx.beginPath();
                ctx.moveTo(sunX, sunY);
                ctx.arc(sunX, sunY, Math.max(width, height) * 1.1, angle - rayWidth, angle + rayWidth);
                ctx.closePath();
                ctx.fillStyle = rayGrad;
                ctx.fill();
            }
            ctx.restore();
        }

        function drawHorizonAndGround(parallaxX, parallaxY) {
            const horizonY = height * 0.48 + parallaxY * 0.25;

            ctx.fillStyle = '#140a1c';
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            for (let x = 0; x <= width; x += 16) {
                const h = 10 + Math.sin(x * 0.02) * 6 + Math.cos(x * 0.05) * 4;
                ctx.lineTo(x + parallaxX * 0.15, horizonY - h);
            }
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();

            const groundGrad = ctx.createLinearGradient(0, horizonY, 0, height);
            groundGrad.addColorStop(0, '#13091b');
            groundGrad.addColorStop(1, '#050208');

            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, horizonY, width, height - horizonY);
        }

        let lastTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        const targetFPS = 60;
        const frameInterval = 1000 / targetFPS;
        let accumulatedDelta = 0;

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const elapsed = currentTime - lastTime;
            lastTime = currentTime;
            accumulatedDelta += elapsed;

            if (accumulatedDelta >= frameInterval) {
                const dt = Math.min(accumulatedDelta / 1000, 0.033);
                accumulatedDelta %= frameInterval;

                params.time += dt;

                frameCount++;
                if (currentTime - lastFpsUpdate >= 1000) {
                    document.getElementById('fpsCounter').textContent = `${frameCount} FPS`;
                    frameCount = 0;
                    lastFpsUpdate = currentTime;
                }

                mouse.x += (mouse.targetX - mouse.x) * (dt * 8);
                mouse.y += (mouse.targetY - mouse.y) * (dt * 8);

                mouse.parallaxX = ((mouse.x / width) - 0.5) * 40;
                mouse.parallaxY = ((mouse.y / height) - 0.5) * 24;

                ctx.drawImage(skyCanvas, 0, 0);
                drawSunAndRays(mouse.parallaxX, mouse.parallaxY);
                drawHorizonAndGround(mouse.parallaxX, mouse.parallaxY);

                for (let i = 0; i < lilies.length; i++) {
                    lilies[i].update(dt);
                    lilies[i].draw(mouse.parallaxX, mouse.parallaxY);
                }

                for (let i = 0; i < particles.length; i++) {
                    particles[i].update(dt);
                    particles[i].draw(mouse.parallaxX, mouse.parallaxY);
                }
            }
        }

        window.addEventListener('resize', () => {
            initScene();
        });

        const updateMousePos = (x, y) => {
            mouse.targetX = x;
            mouse.targetY = y;
        };

        window.addEventListener('mousemove', (e) => updateMousePos(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        document.getElementById('windSpeed').addEventListener('input', (e) => {
            params.windSpeed = parseFloat(e.target.value);
            document.getElementById('windVal').textContent = params.windSpeed.toFixed(1);
        });

        document.getElementById('sunGlow').addEventListener('input', (e) => {
            params.sunGlow = parseFloat(e.target.value);
            document.getElementById('glowVal').textContent = params.sunGlow.toFixed(1);
        });

        document.getElementById('particleDensity').addEventListener('input', (e) => {
            params.particleDensity = parseInt(e.target.value);
            document.getElementById('particleVal').textContent = params.particleDensity;
            
            while (particles.length < params.particleDensity) {
                particles.push(new RomanticParticle());
            }
            if (particles.length > params.particleDensity) {
                particles.length = params.particleDensity;
            }
        });

        const toggleControlsBtn = document.getElementById('toggleControlsBtn');
        const controlsBody = document.getElementById('controlsBody');
        const controlIcon = document.getElementById('controlIcon');
        let controlsExpanded = false;
        controlsBody.style.display = 'none';
        controlIcon.className = 'fa-solid fa-chevron-up';

        toggleControlsBtn.addEventListener('click', () => {
            controlsExpanded = !controlsExpanded;
            controlsBody.style.display = controlsExpanded ? 'grid' : 'none';
            controlIcon.className = controlsExpanded ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-up';
        });

        window.onload = () => {
            initScene();
            requestAnimationFrame((t) => {
                lastTime = t;
                animate(t);
            });
        };
    </script>
</body>
</html>
